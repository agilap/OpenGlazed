# Glazed — fully local stack (no external accounts required)
#
#   docker compose up -d        # Postgres + pgvector + Ollama + API on :3000
#   cp backend/.env.example backend/.env   # set DATABASE_URL + ADMIN_TOKEN
#   # pull local models once:
#   docker exec -it glazed-ollama ollama pull llama3.1
#   docker exec -it glazed-ollama ollama pull nomic-embed-text
#
# The init script (db/init.sql) creates the schema + retrieval functions
# automatically on first boot if they don't exist yet.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: glazed-db
    environment:
      POSTGRES_USER: glazed
      POSTGRES_PASSWORD: glazed
      POSTGRES_DB: glazed
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - glazed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glazed -d glazed"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [glazed-net]

  # Local LLM + embeddings (OpenAI-compatible /v1 API). No API key needed.
  ollama:
    image: ollama/ollama:latest
    container_name: glazed-ollama
    ports:
      - "11434:11434"
    volumes:
      - glazed_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || true"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [glazed-net]

  # API server (built from backend/Dockerfile)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glazed-api
    # Pull env from a local .env if present; otherwise fall back to defaults.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://glazed:glazed@db:5432/glazed}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [glazed-net]
    restart: unless-stopped

networks:
  glazed-net:
    driver: bridge

volumes:
  glazed_pgdata:
  glazed_ollama:
